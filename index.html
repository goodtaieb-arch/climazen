    <title>ClimaZEN by TAIEB — CERFA F-Gas conforme, hors ligne</title>
    <meta name="climazen-build" content="v69" />
    <meta name="climazen-version" content="v69" />
    <script>
      /* Anti-ancien-cache : compare version.json (réseau) vs localStorage */
      (function () {
        try {
          var KEY = 'climazen_boot_v'
          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (j) {
              if (!j || !j.version) return
              var server = String(j.version)
              var local = localStorage.getItem(KEY)
              if (local && local !== server && sessionStorage.getItem('climazen_reloading') !== '1') {
                sessionStorage.setItem('climazen_reloading', '1')
                var done = function () {
                  localStorage.setItem(KEY, server)
                  var u = new URL(location.href)
                  u.searchParams.set('v', server)
                  u.searchParams.set('_', String(Date.now()))
                  location.replace(u.toString())
                }
                var clear = Promise.resolve()
                if (window.caches) {
                  clear = caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                  })
                }
                clear
                  .then(function () {
                    return navigator.serviceWorker
                      ? navigator.serviceWorker.getRegistrations()
                      : []
                  })
                  .then(function (regs) {
                    return Promise.all((regs || []).map(function (r) { return r.unregister() }))
                  })
                  .then(done)
                  .catch(done)
              } else {
                localStorage.setItem(KEY, server)
                sessionStorage.removeItem('climazen_reloading')
              }
            })
            .catch(function () {})
        } catch (e) {}
      })()
    </script>

  <body>
