    <title>ClimaZEN by TAIEB — CERFA F-Gas conforme</title>
    <meta name="climazen-build" content="v265" />
    <meta name="climazen-version" content="v265" />
    <script>
      /* À CHAQUE ouverture : vider le cache navigateur (SW + Cache Storage)
         pour ne plus retomber sur une page figée.
         Ne JAMAIS effacer localStorage / IndexedDB = saisies hors ligne terrain.
         Timeout 700 ms : sinon le reload ne part jamais (mobile). */
      (function () {
        try {
          var KEY = 'climazen_boot_v'
          var RELOAD = 'climazen_reloading'
          var params = new URLSearchParams(location.search)
          var forcedMaj = params.get('maj') === '1'

          function withTimeout(promise, ms) {
            return new Promise(function (resolve) {
              var done = false
              var t = setTimeout(function () {
                if (!done) {
                  done = true
                  resolve(null)
                }
              }, ms)
              promise
                .then(function (v) {
                  if (!done) {
                    done = true
                    clearTimeout(t)
                    resolve(v)
                  }
                })
                .catch(function () {
                  if (!done) {
                    done = true
                    clearTimeout(t)
                    resolve(null)
                  }
                })
            })
          }

          /* Cache de l’app seulement — pas les données métier. */
          function purgeShellCache() {
            var clear = Promise.resolve()
            if (window.caches) {
              clear = caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k) }))
              })
            }
            return clear
              .then(function () {
                return navigator.serviceWorker
                  ? navigator.serviceWorker.getRegistrations()
                  : Promise.resolve([])
              })
              .then(function (regs) {
                var list = regs || []
                return Promise.all(list.map(function (r) { return r.unregister() })).then(function () {
                  return list.length > 0
                })
              })
          }

          function reloadTo(server) {
            if (server) localStorage.setItem(KEY, server)
            var u = new URL(location.href)
            if (server) u.searchParams.set('v', server)
            u.searchParams.set('_', String(Date.now()))
            u.searchParams.delete('maj')
            location.href = u.toString()
          }

          var purged = withTimeout(purgeShellCache(), 700)

          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (j) {
              var server = j && j.version ? String(j.version) : ''
              var meta = document.querySelector('meta[name="climazen-version"]')
              var pageV = meta ? String(meta.getAttribute('content') || '') : ''

              return purged.then(function (hadSw) {
                if (pageV && server && pageV === server) {
                  localStorage.setItem(KEY, server)
                  if (forcedMaj) {
                    params.delete('maj')
                    params.delete('v')
                    params.delete('_')
                    var clean = location.pathname + (params.toString() ? '?' + params.toString() : '') + location.hash
                    history.replaceState(null, '', clean)
                  }
                  /* Un SW contrôlait encore la page : un reload pour le lâcher. */
                  if (hadSw && sessionStorage.getItem(RELOAD) !== '1') {
                    sessionStorage.setItem(RELOAD, '1')
                    reloadTo(server)
                    return
                  }
                  sessionStorage.removeItem(RELOAD)
                  return
                }
                if (sessionStorage.getItem(RELOAD) === '1' && !forcedMaj) return
                sessionStorage.setItem(RELOAD, '1')
                reloadTo(server || pageV)
              })
            })
            .catch(function () {
              /* Hors ligne : on vide quand même le cache app, on garde les saisies. */
              purged.then(function (hadSw) {
                if (hadSw && sessionStorage.getItem(RELOAD) !== '1') {
                  sessionStorage.setItem(RELOAD, '1')
                  location.reload()
                }
              })
            })

          window.addEventListener('pageshow', function (ev) {
            if (ev.persisted) void purgeShellCache()
          })
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
