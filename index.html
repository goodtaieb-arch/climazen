      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"

    <title>ClimaZEN by TAIEB — CERFA F-Gas conforme, hors ligne</title>
    <meta name="climazen-build" content="v80" />
    <meta name="climazen-version" content="v80" />
    <script>
      /* Anti-ancien-cache : compare version.json (réseau) vs localStorage.
         Ne jamais écraser la clé boot avec l’ancien JS — seulement avec la version serveur.
         La purge SW/cache a un timeout : sinon le reload ne part jamais (mobile). */
      (function () {
        try {
          var KEY = 'climazen_boot_v'
          var RELOAD = 'climazen_reloading'
          var params = new URLSearchParams(location.search)
          var forcedMaj = params.get('maj') === '1'

          function withTimeout(promise, ms) {
            return new Promise(function (resolve) {
              var done = false
              var t = setTimeout(function () {
                if (!done) {
                  done = true
                  resolve(null)
                }
              }, ms)
              promise
                .then(function (v) {
                  if (!done) {
                    done = true
                    clearTimeout(t)
                    resolve(v)
                  }
                })
                .catch(function () {
                  if (!done) {
                    done = true
                    clearTimeout(t)
                    resolve(null)
                  }
                })
            })
          }

          function purge() {
            var clear = Promise.resolve()
            if (window.caches) {
              clear = caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k) }))
              })
            }
            return clear
              .then(function () {
                return navigator.serviceWorker
                  ? navigator.serviceWorker.getRegistrations()
                  : Promise.resolve([])
              })
              .then(function (regs) {
                return Promise.all((regs || []).map(function (r) { return r.unregister() }))
              })
          }

          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (j) {
              if (!j || !j.version) return
              var server = String(j.version)
              var meta = document.querySelector('meta[name="climazen-version"]')
              var pageV = meta ? String(meta.getAttribute('content') || '') : ''
              /* Si le HTML servi est déjà à jour, mémoriser et sortir */
              if (pageV && pageV === server) {
                localStorage.setItem(KEY, server)
                sessionStorage.removeItem(RELOAD)
                if (forcedMaj) {
                  params.delete('maj')
                  params.delete('v')
                  params.delete('_')
                  var clean = location.pathname + (params.toString() ? '?' + params.toString() : '') + location.hash
                  history.replaceState(null, '', clean)
                }
                return
              }
              /* Déjà une tentative auto cette session → laisser le bouton MAJ
                 (sauf si l’utilisateur vient de cliquer MAJ : ?maj=1) */
              if (sessionStorage.getItem(RELOAD) === '1' && !forcedMaj) return

              sessionStorage.setItem(RELOAD, '1')
              var done = function () {
                localStorage.setItem(KEY, server)
                var u = new URL(location.href)
                u.searchParams.set('v', server)
                u.searchParams.set('_', String(Date.now()))
                u.searchParams.delete('maj')
                location.href = u.toString()
              }
              withTimeout(purge(), 700).then(done)
            })
            .catch(function () {})
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
